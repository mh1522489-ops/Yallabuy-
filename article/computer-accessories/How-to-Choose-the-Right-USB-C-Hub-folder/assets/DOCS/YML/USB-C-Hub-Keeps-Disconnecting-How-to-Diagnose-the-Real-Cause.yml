# ============================================================
accessibility:
  standard: WCAG 2.2 Level AA

  semantic_html:
    header: true
    nav: true
    main: true
    section: true
    article: true
    aside: true
    footer: true
    button: true
    a: true
    rule: "مفيش div في مكان لازم فيه عنصر دلالي"

  aria:
    skip_link: true
    theme_toggle:
      aria_label: "Toggle dark mode"
      aria_pressed: true
    menu_toggle:
      aria_label: "Open menu"
      aria_expanded: true
      aria_controls: true
    faq_triggers:
      aria_expanded: true
      aria_controls: true
    faq_panels:
      role: region
      aria_labelledby: true
    breadcrumbs:
      aria_label: "Breadcrumb"
      aria_current: page
    author_card:
