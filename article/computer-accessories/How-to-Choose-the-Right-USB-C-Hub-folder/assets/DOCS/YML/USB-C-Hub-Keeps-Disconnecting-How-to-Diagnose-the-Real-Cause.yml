# ============================================================
# 9. معمارية الـ CSS
# ============================================================
css_architecture:
  type: inline
  placement: inside_head

  order:
    - design_tokens_root
    - dark_mode_tokens
    - reset
    - focus_styles
    - skip_link
    - container
    - header
    - hero
    - article_body
    - callout
    - sources
    - faq
    - author_card
    - reduced_motion
    - footer
    - responsive_rules

  responsive_breakpoints:
    - breakpoint: 768px
      changes:
        - container padding 20px
        - primary nav hidden
        - menu toggle visible
        - hero one column
        - footer one column

  css_rules:
    - all values from tokens
    - focus-visible used instead of focus
    - focus-visible outline 3px brand color
    - no !important
    - no unnecessary specificity
    - selectors clear and descriptive

# ============================================================
# 10. معمارية الـ JavaScript
# ============================================================
javascript_architecture:
  type: inline
  placement: end_of_body
  pattern: IIFE
  use_strict: true
  globals: 0

  functions:
    - name: initThemeToggle
      purpose: "تبديل بين light/dark mode + حفظ في localStorage"
      storage_key: yallabuy-theme
      steps:
        - read preference from localStorage
        - apply theme if exists
        - update aria-pressed
        - on click toggle theme
        - update aria-pressed
        - save to localStorage
        - if localStorage unavailable print warning

    - name: initMobileMenu
      purpose: "فتح/قفل قائمة الموبايل + Escape"
      elements:
        - "#menu-toggle"
        - "#mobile-menu"
      steps:
        - select toggle and menu
        - if either missing return
        - on click toggle aria-expanded and hidden
        - on link click close menu
        - on Escape close menu and return focus

    - name: initFaq
      purpose: "تشغيل الـ FAQ accordion + keyboard navigation"
      elements:
        - ".faq-trigger"
      steps:
        - select all triggers
        - if none return
        - for each trigger add click event
        - for each trigger add Escape keydown
        - add ArrowUp/ArrowDown navigation
      keyboard:
        enter_space: toggle
        escape: close open item
        arrow_down: next question
        arrow_up: previous question

    - name: initImageFallback
      purpose: "تبديل الصور المكسورة بـ placeholder"
      elements:
        - all img tags
      steps:
        - select all images
        - for each image add error event listener
        - on error swap src with SVG placeholder
        - set data-fallback-applied to prevent repeat
      placeholder:
        type: svg_inline
        text: "Image unavailable"
        no_network_request: true
        cls_safe: true

  js_rules:
    - const and let only no var
    - defensive null checks before any DOM operation
    - addEventListener only no inline handlers
    - no innerHTML with untrusted data
    - no eval
    - no globals
    - no secrets in code
    - all errors handled visibly console.warn
    - initialization after DOMContentLoaded

  initialization:
    function: init
    timing: "DOMContentLoaded or immediate if already loaded"
    call_order:
      - initThemeToggle
      - initMobileMenu
      - initFaq
      - initImageFallback

