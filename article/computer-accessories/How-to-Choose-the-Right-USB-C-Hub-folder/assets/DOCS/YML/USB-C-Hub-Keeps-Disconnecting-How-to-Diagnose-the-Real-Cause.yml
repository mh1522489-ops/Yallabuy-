        border: "#e8e4dc"
        border-strong: "#d8d2c5"
        brand: "#0f766e"
        brand-soft: "#ccfbf1"
        brand-deep: "#134e4a"
        accent: "#b45309"
      dark:
        bg: "#14181b"
        bg-soft: "#1a1f23"
        surface: "#1c2226"
        surface-2: "#20262a"
        text: "#f1f1ef"
        text-2: "#c4c4c2"
        muted: "#8f9396"
        border: "#2a3136"
        border-strong: "#3a4247"
        brand: "#2dd4bf"
        brand-soft: "#0f2e2b"
        brand-deep: "#5eead4"
        accent: "#f59e0b"

    spacing:
      s1: "4px"
      s2: "8px"
      s3: "12px"
      s4: "16px"
      s5: "24px"
      s6: "32px"
      s7: "48px"
      s8: "64px"
      rule: "مفيش قيم مسافات عشوائية في أي مكان"

    radius:
      r-sm: "8px"
      r: "14px"
      r-lg: "22px"

    shadows:
      sh-sm: "0 1px 2px rgba(20,20,20,.04), 0 2px 8px rgba(20,20,20,.04)"
      sh: "0 4px 24px rgba(20,20,20,.06)"
      sh-lg: "0 12px 40px rgba(20,20,20,.08)"

    z_index:
      z-dropdown: 100
      z-sticky: 200
      z-mobile: 300
      z-modal: 400
      z-toast: 500

  typography:
    system_fonts_only: true
    no_web_fonts: true
    no_font_face: true
    no_google_fonts: true
    no_font_preload: true
    no_font_display_swap: true
    roles:
      editorial_body:
        font: 'Georgia, "Times New Roman", serif'
        usage:
          - paragraphs
          - lists
          - faq_answers
      ui:
        font: 'Arial, Helvetica, sans-serif'
        usage:
          - headings
          - buttons
          - metadata
          - navigation
          - chips
          - source_tags
    heading_sizes:
      h1: "clamp(28px, 4vw, 44px)"
      h2: "28px"
      h3: "22px"
    body_text:
      size: "18px"
      line_height: "1.7"
    rules:
      - typography ثابت قبل وبعد تحميل الصفحة
      - مفيش layout shift بسبب الخطوط

  dark_mode:
    mechanism: data-theme_attribute
    element: html
    default: light
    toggle: "#theme-toggle"
    storage_key: yallabuy-theme
    storage_type: localStorage
    rules:
      - tokens بتتبدل بس (ألوان، خلفيات، حدود)
      - components مش بتتغير شكلها
      - spacing مش بيتغير
      - typography مش بتتغير
      - layout مش بيتغير
      - التفضيل بيتحفظ في localStorage
      - لو localStorage مش متاح، التبديل شغال بس مش بيتحفظ

  transitions:
    default: "0.25s cubic-bezier(.4,0,.2,1)"
    faq_accordion: "border-color, box-shadow"
    faq_icon: "transform: rotate(45deg)"
    hover_headings: "color change"
    reduced_motion:
      respected: true
      implementation: |
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

