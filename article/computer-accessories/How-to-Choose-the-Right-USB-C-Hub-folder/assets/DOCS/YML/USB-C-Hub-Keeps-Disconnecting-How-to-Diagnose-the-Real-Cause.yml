    mobile_menu_touch: true
    faq_accordion_touch: true

# ============================================================
# 12. الأداء (Performance)
# ============================================================
performance:
  targets:
    lcp: "< 2.5s"
    inp: "< 200ms"
    cls: "< 0.1"

  lcp_strategy:
    - hero image preloaded with fetchpriority high
    - hero image eager not lazy
    - css inline no blocking request
    - no web fonts zero font requests
    - no render-blocking scripts

  cls_strategy:
    - all images have width and height attributes
    - font stable no font swap
    - no content inserted above existing content
    - faq panels open without layout jump

  inp_strategy:
    - all js at end of body
    - no third-party scripts
    - event listeners lightweight
    - no long-running main thread javascript

  network_requests:
    html: 1
    css: 0
    js: 0
    fonts: 0
    hero_image: 1
    total_base: 2

# ============================================================
# 13. استراتيجية الصور
# ============================================================
image_strategy:
  hero_image:
    loading: eager
    fetchpriority: high
    decoding: async
    width: 1200
    height: 675
    preload: true
    is_lcp: true
    rule: "Never lazy-load the LCP image"
    alt: "A USB-C hub disconnected from a laptop, lying on a desk next to a coiled cable"

  fallback_strategy:
    trigger: image error event
    action: swap src with SVG placeholder
    placeholder_type: svg_inline
    placeholder_text: "Image unavailable"
    prevention_flag: data-fallback-applied
    cls_safe: true
    no_network_request: true
    benefits:
      - layout لاينهارش لو الصورة مش متاحة
      - المستخدم بيشوف رسالة واضحة
      - مفيش طلب شبكة إضافي

  alt_text_rules:
    - descriptive not keyword-stuffed
    - describes visual content
    - empty alt for decorative images only

