      color: #222222;

      display: flex;

    header {
      width: 100%;

    .logo {

      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 20px;
    }

    .error-container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .error-number {
      font-size: clamp(100px, 22vw, 190px);
      line-height: 0.9;
      font-weight: 900;
      color: #ff9900;
      letter-spacing: -10px;
      margin-bottom: 25px;
    }

    .error-container h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 15px;
      color: #222222;
    }

      font-size: 17px;

    }

      justify-content: center;

      flex-wrap: wrap;
    }

      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 25px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .primary-btn {
      background: #ff9900;
      color: #ffffff;
    }

    .primary-btn:hover {
      background: #e88b00;
      transform: translateY(-1px);
    }

    .secondary-btn {
      border: 1px solid #dddddd;
      color: #333333;
      background: #ffffff;
    }

    .secondary-btn:hover {
      border-color: #ff9900;
      color: #ff9900;
    }

    footer {
      text-align: center;
      padding: 25px 20px;
      border-top: 1px solid #eeeeee;
      color: #888888;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 20px;
      }

      .logo {
        font-size: 22px;
      }

      .home-link {
        font-size: 14px;
      }

      main {
        padding: 50px 20px;
      }

      .error-number {
        letter-spacing: -5px;
        margin-bottom: 20px;
      }

      .error-container p {
        font-size: 15px;
      }

      .actions {

        margin: auto;
      }

      .btn {
        width: 100%;
      }
    }
