  - item: hero_image
    current: /images/articles/usb-hub-disconnect-explainer-placeholder.avif
    replace_with: real image 1200x675
    locations:
      - og:image
      - twitter:image
      - preload link
      - img src
      - JSON-LD Article image
  - item: hero_image_alt
    current: "A USB-C hub disconnected from a laptop, lying on a desk next to a coiled cable"
    replace_with: description of real image
    locations:
      - og:image:alt
      - twitter:image:alt
      - img alt

  rule: "Never invent dates. Never invent image URLs."

# ============================================================
# 17. القيود المعروفة (Known Limitations)
# ============================================================
known_limitations:
  placeholders:
    - dates not present in meta or JSON-LD
    - hero image is placeholder
    - must be replaced before publish

  json_ld:
    - Article schema has no datePublished or dateModified
    - dates must be added in ISO 8601 when available

  mobile_menu:
    - closes when any link inside is clicked
    - closes on Escape
    - intended behavior

  faq:
    - only one question open at a time
    - intentional design choice
    - to allow multiple open remove the close-others code

