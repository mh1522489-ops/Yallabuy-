<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>You're Offline | YallaBuy</title>

  <style>
    :root {
      --orange: #ff9900;
      --text: #171717;
      --muted: #666;
      --border: #e8e8e8;
      --background: #fafafa;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background: var(--background);
    }

    .offline-card {
      width: min(100%, 720px);
      padding: 48px 32px;

      text-align: center;

      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.06);
    }

    .illustration {
      width: min(100%, 300px);
      margin: 0 auto 32px;
    }

    .illustration svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 16px;
      padding: 7px 12px;

      color: #8a5700;
      background: #fff4df;

      border: 1px solid #ffe0a3;
      border-radius: 999px;

      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
    }

    h1 {
      margin-bottom: 14px;

      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.1;
      letter-spacing: -1.5px;
    }

    .description {
      max-width: 520px;
      margin: 0 auto;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;

      margin-top: 30px;
    }

    button,
    .home-link {
      min-height: 46px;
      padding: 0 20px;

      border-radius: 12px;

      font: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
      text-decoration: none;
    }

    .retry {
      border: 0;
      color: #111;
      background: var(--orange);
    }

    .retry:hover {
      filter: brightness(0.96);
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      color: var(--text);
      background: var(--white);

      border: 1px solid var(--border);
    }

    .home-link:hover {
      border-color: #ccc;
    }

    .brand {
      margin-top: 34px;

      color: #999;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    @media (max-width: 520px) {
      .offline-card {
        padding: 36px 22px;
        border-radius: 20px;
      }

      .illustration {
        width: 240px;
        margin-bottom: 26px;
      }

      .actions {
        flex-direction: column;
      }

      button,
      .home-link {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .wifi-wave {
        animation: pulse 2s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }
    }
  </style>
</head>

<body>

  <main class="offline-card">

    <div class="illustration" aria-hidden="true">

      <svg
        viewBox="0 0 400 300"
        xmlns="http://www.w3.org/2000/svg"
      >

        <!-- Background shape -->
        <rect
          x="40"
          y="35"
          width="320"
          height="230"
          rx="28"
          fill="#fff8ed"
        />

        <!-- Laptop -->
        <rect
          x="105"
          y="75"
          width="190"
          height="125"
          rx="12"
          fill="#ffffff"
          stroke="#171717"
          stroke-width="6"
        />

        <!-- Screen -->
        <rect
          x="120"
          y="90"
          width="160"
          height="95"
          rx="6"
          fill="#fafafa"
        />

        <!-- Browser top bar -->
        <circle cx="133" cy="103" r="3" fill="#ff9900"/>
        <circle cx="144" cy="103" r="3" fill="#ddd"/>
        <circle cx="155" cy="103" r="3" fill="#ddd"/>

        <!-- Wi-Fi broken icon -->
        <path
          d="M155 135
             C178 115 222 115 245 135"
          fill="none"
          stroke="#ff9900"
          stroke-width="8"
          stroke-linecap="round"
        />

        <path
          d="M170 150
             C185 137 215 137 230 150"
          fill="none"
          stroke="#ff9900"
          stroke-width="8"
          stroke-linecap="round"
        />

        <circle
          cx="200"
          cy="166"
          r="6"
          fill="#ff9900"
        />

        <!-- Broken line -->
        <path
          d="M185 125 L215 170"
          stroke="#171717"
          stroke-width="7"
          stroke-linecap="round"
        />

        <!-- Laptop base -->
        <path
          d="M85 210
             H315
             L330 225
             Q332 232 320 232
             H80
             Q68 232 70 225
             Z"
          fill="#171717"
        />

        <!-- Orange accent -->
        <rect
          x="175"
          y="216"
          width="50"
          height="4"
          rx="2"
          fill="#ff9900"
        />

        <!-- Decorative dots -->
        <circle cx="78" cy="75" r="5" fill="#ff9900"/>
        <circle cx="325" cy="100" r="4" fill="#ff9900"/>
        <circle cx="70" cy="190" r="3" fill="#ddd"/>
        <circle cx="335" cy="185" r="5" fill="#eee"/>

        <!-- Wi-Fi waves -->
        <g class="wifi-wave">
          <path
            d="M150 45 C180 20 220 20 250 45"
            fill="none"
            stroke="#ff9900"
            stroke-width="5"
            stroke-linecap="round"
            opacity=".35"
          />
        </g>

      </svg>

    </div>

    <div class="status">
      <span class="status-dot"></span>
      You're offline
    </div>

    <h1>No internet connection</h1>

    <p class="description">
      We couldn't load this page right now.
      Check your internet connection and try again.
    </p>

    <div class="actions">

      <button
        class="retry"
        type="button"
        onclick="location.reload()"
      >
        Try again
      </button>

      <a
        class="home-link"
        href="/"
      >
        Back to YallaBuy
      </a>

    </div>

    <p class="brand">
      YallaBuy · Research first, buy second.
    </p>

  </main>

</body>
</html>
