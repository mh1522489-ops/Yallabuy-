# ============================================================
# 19. Checklist قبل النشر
# ============================================================
pre_publish_checklist:
  - dates replaced with real values
  - hero image replaced with real image
  - alt text matches real image
  - canonical URL correct
  - all internal links use yallabuy.shop
  - no Vercel URLs
  - JSON-LD valid Rich Results Test
  - JSON-LD valid Schema Markup Validator
  - PageSpeed Insights LCP under 2.5s INP under 200ms CLS under 0.1
  - keyboard testing done
  - screen reader testing done
  - mobile testing done
  - FAQ visible matches FAQPage schema
  - no console errors
  - dark mode works
  - mobile menu works
  - faq accordion works with keyboard
  - image fallback works test with broken image

# ============================================================
# 20. المبدأ النهائي
# ============================================================
final_principle:
  page_type: informational_article
  not_a_product_page: true
  not_a_review_page: true
  not_a_sales_page: true

  schema_represents_visible_content: true
  design_system_followed: true
  accessibility_built_in: true
  performance_integrated: true

  edit_rules:
    - المحتوى الزيادة مبني على مصادر موثقة
    - الـ schema الجديد بيمثل المحتوى المرئي
    - الـ design tokens مستخدمة
    - الـ accessibility محفوظة
    - الـ performance مش اتأثرت سلبًا
    - الـ testing اتعمل بعد التعديل

  goal: "الهدف مش إن الصفحة تبقى كبيرة. الهدف إنها تبقى صحيحة."