# ============================================================
# 5. الالتزام بـ Design System
# ============================================================
design_system:
  version: 1.2
  compliance: full

  design_tokens:
    colors:
      light:
        bg: "#fbfaf7"
        bg-soft: "#f3f1ec"
        surface: "#ffffff"
        surface-2: "#f8f6f1"
        text: "#1a1a1a"
        text-2: "#4a4a4a"
